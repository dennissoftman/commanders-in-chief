[package]
name = "cic-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
cic-assets.workspace = true
cic-camera.workspace = true
# The interface model, for the pass that draws it. The dependency runs this way and never back, the same
# rule ADR 0003 sets for assets: a layout solver must not inherit a graphics stack.
cic-ui.workspace = true
png = "0.18"
sha2 = "0.10"
wgpu = { version = "30", default-features = false, features = [
    "std",
    "dx12",
    "metal",
    "vulkan",
    "wgsl",
] }

[dev-dependencies]
# Tests and examples only: the render *library* knows nothing about simulation. A host composes the
# two, and the terrain viewer and the scenario capture test are hosts.
cic-sim.workspace = true
# The interface capture tests load the shell's own authored screens and build them into a shell.
cic-ui.workspace = true
# The same WGSL front end `wgpu` uses, so validating with it means the shaders really compile.
naga = { version = "27", features = ["wgsl-in"] }
pollster = "0.4"
# Only the viewer example opens a window, so the windowing library stays out of the library itself.
winit = "0.30"
# The capture tests construct encoders directly, so they need the graphics API in scope.
wgpu = { version = "30", default-features = false, features = ["std", "dx12", "metal", "vulkan", "wgsl"] }

[lints]
workspace = true
