name: CI

# Documentation-only changes skip the job entirely. `paths-ignore` names only paths that
# cannot affect a build, rather than `paths` naming the ones that can, so a file type
# nobody anticipated still runs CI instead of being silently skipped. On `pull_request`
# the filter is evaluated over the whole PR diff, so a branch touching both code and docs
# still runs. GitHub Actions does not expand YAML anchors, so the two lists are kept in
# sync by hand.
#
# `push` is scoped to `main` so a branch is checked once rather than twice. Pushing a branch
# and opening a pull request for it are two events over one commit, and an unscoped `push`
# ran the identical job for both. `main` still runs post-merge, which is also what keeps the
# dependency cache below warm for every later branch.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - '.gitignore'

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: clippy,rustfmt
      # Nothing was cached before this, so every run rebuilt every dependency from source.
      # That is the whole of the job's cost: the workspace's own crates compile in seconds,
      # and the dev profile builds dependencies at `opt-level = 3` (see the profile comment
      # in `Cargo.toml`), which the runner paid for on every push.
      #
      # The cache key covers the toolchain, the lockfile, and the profile settings, so a
      # dependency bump or a profile change invalidates it rather than restoring artifacts
      # built under different settings. GitHub scopes a cache written on a branch to that
      # branch, so the run that populates the reusable copy is the `main` run after a merge;
      # a pull request restores from `main` and is a cold build only when the key changes.
      - uses: Swatinem/rust-cache@v2
        with:
          # `clippy --all-targets` and `test` share one target directory here, so one key
          # covers both. Saving on failure keeps a red formatting or lint run from throwing
          # away a complete dependency build.
          cache-on-failure: true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
