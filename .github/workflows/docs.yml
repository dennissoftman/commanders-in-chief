name: Docs

# A separate workflow because `ci.yml` cannot host this. That workflow sets `paths-ignore`
# for `**/*.md` at the workflow level, so a documentation-only change skips every job it
# defines — which is exactly the change this check exists to catch. A job added there would
# be silently absent on the pull requests that need it most.
#
# This one uses `paths` where `ci.yml` deliberately uses `paths-ignore`, and the reasoning
# inverts with the subject. `ci.yml` cannot enumerate everything that might affect a build,
# so it names what cannot and lets anything unanticipated run. This job checks documents
# against a table inside a document; that set is closed and known, so naming it is precise
# rather than a guess. A target added outside these paths fails the generator itself, which
# refuses a target file containing no spans, rather than passing quietly.
#
# The two path lists are identical and kept in sync by hand, for the reason `ci.yml` already
# records: GitHub Actions does not expand YAML anchors.
on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'tools/generate-doc-counts.py'
      - 'tools/check-doc-links.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'tools/generate-doc-counts.py'
      - 'tools/check-doc-links.py'
      - '.github/workflows/docs.yml'

jobs:
  counts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Several documents quote how many engine requirements the mechanics design obliges,
      # and those numbers are derived from one table in `docs/design/mechanics.md`. Every
      # one of them was wrong at least once while the design was being written, because
      # adding a row to a table in one file does not remind anybody to edit a sentence in
      # two others. Generating them and diffing turns that into a failing check, the same
      # shape as the NOTICES.md step in `ci.yml`.
      #
      # `--check` runs first because it names the stale files and the command that fixes
      # them, which is more use in a log than a bare diff. The regenerate-and-diff after it
      # is belt and braces: it catches a generator that reported clean while writing
      # nothing.
      - name: derived counts are in step with their source table
        run: |
          python3 tools/generate-doc-counts.py --check
          python3 tools/generate-doc-counts.py
          git diff --exit-code -- docs/
      # The documents cross-reference heavily and deliberately, which is what keeps each
      # fact in one home — and it means a renamed heading or a moved file breaks a
      # reference that nothing in a build reads. The dead link this replaces had outlived
      # the code it pointed at by two milestones. External links are not fetched: that
      # would make a documentation check depend on other people's uptime.
      #
      # Note the scope difference from the step above. Counts live in three documents under
      # `docs/`; links are checked across every markdown file in the tree, including the
      # root README, CONTRIBUTING, and the workflow skill.
      - name: every relative link and anchor resolves
        run: python3 tools/check-doc-links.py
      # The ADR index is not decoration: the rule that a record adds its row in the same
      # commit is the whole mechanism stopping two branches from silently claiming one
      # number, and a table that has drifted is a mechanism nobody can trust. Six records
      # read `accepted` in the index while their implementations had long landed, and two
      # said different things in the two places — one of them while carrying a section
      # describing its own implementation.
      - name: the ADR index agrees with the records
        run: python3 tools/check-adr-index.py
